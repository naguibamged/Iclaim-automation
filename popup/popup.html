<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iclaim Automation</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="mark" src="../icons/icon128.png" alt="" />
      <div>
        <h1>Iclaim Automation</h1>
        <p id="status">Ready</p>
      </div>
    </header>

    <section class="card row">
      <div>
        <span class="label">Automation</span>
        <strong id="switch-label">Off</strong>
      </div>
      <label class="switch">
        <input id="enabled" type="checkbox" />
        <span class="slider"></span>
      </label>
    </section>

    <section class="card row">
      <div>
        <span class="label">Work in background</span>
        <strong id="background-label">Off</strong>
      </div>
      <label class="switch">
        <input id="work-in-background" type="checkbox" />
        <span class="slider"></span>
      </label>
    </section>

    <section class="card" id="testing-card" hidden>
      <div id="testing-password-row" hidden>
        <label class="label" for="testing-password">Password</label>
        <input id="testing-password" class="field" type="password" spellcheck="false" autocomplete="off" />
        <button id="testing-unlock" type="button">Unlock</button>
      </div>
      <div id="testing-panel" hidden>
        <button id="test-detect" type="button">Detect messages</button>
        <pre id="detect-result">No detect yet.</pre>
        <button id="test-reply" type="button">Reply</button>
        <button id="test-search" type="button">Search</button>
        <button id="test-attach" type="button">Send attachment</button>
      </div>
    </section>

    <section class="card">
      <label class="label" for="claim-number">Test National ID or Claim ID</label>
      <input id="claim-number" class="field" type="text" spellcheck="false" placeholder="739956 or 14-digit ID" />
      <button id="run-claim" type="button">Search and send</button>
    </section>

    <section class="card">
      <label class="label" for="group-name">WhatsApp group</label>
      <input id="group-name" class="field" type="text" spellcheck="false" />

      <label class="label" for="worklist-url">iClaim worklist</label>
      <input id="worklist-url" class="field" type="text" spellcheck="false" />

      <label class="label" for="committee-url">Committee site</label>
      <input id="committee-url" class="field" type="text" spellcheck="false" />

      <button id="open-replies" class="ghost" type="button">Reply messages</button>
    </section>

    <section class="card">
      <span class="label">Last result</span>
      <pre id="result">No run yet.</pre>
    </section>

    <script src="../shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
